name: Build and test

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]
  workflow_call:
    inputs:
      release_version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.release_version || '0.0.0-dev' }}
    steps:
      - name: Validate release version
        if: inputs.release_version != ''
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]]; then
            echo "::error::Use a version such as 0.1.0 or 0.1.0-rc.1."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Ban Kotlin non-null assertions
        shell: bash
        run: |
          if git grep -nF -e '!!' -- '*.kt' '*.kts'; then
            echo "::error::Kotlin files must not contain double exclamation marks."
            exit 1
          else
            # git grep exits 1 when there are no matches.
            test "$?" -eq 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        run: ./gradlew --stacktrace build

      - name: Save release JARs
        if: inputs.release_version != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-jars
          path: build/libs/*-${{ inputs.release_version }}.jar
          if-no-files-found: error
          overwrite: true
