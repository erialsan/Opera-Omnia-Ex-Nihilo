name: Update Gradle

on:
  schedule:
    - cron: '23 9 * * 1'
      timezone: Asia/Tokyo
  workflow_dispatch:

concurrency:
  group: update-gradle

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.0.0-dev
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v5

      - name: Update the build script
        run: ./gradlew --no-configuration-cache --stacktrace updateBuildScript
      - name: Update GTNH dependencies
        run: ./gradlew --no-configuration-cache --stacktrace updateDependencies
      - name: Build updated project
        shell: bash
        run: |
          if ! git diff --quiet; then
            git diff --stat
            ./gradlew --stacktrace build
          fi

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          branch: codex/gtnh-updates
          commit-message: Update GTNH build script and dependencies
          title: Update GTNH build script and dependencies
          body: Generated by GTNHGradle's `updateBuildScript` and `updateDependencies` tasks. The updated project passed `./gradlew build`.
          add-paths: |
            dependencies.gradle
            gradle.properties
            settings.gradle.kts
            gradle
            gradlew
            gradlew.bat
